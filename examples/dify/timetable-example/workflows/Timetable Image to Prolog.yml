    - data:
        code: "import json\nimport re\nfrom collections import Counter\n\n\ndef prolog_atom(value):\n\
          \    escaped = value.replace(\"\\\\\", \"\\\\\\\\\").replace(\"'\", \"''\"\
          )\n    return \"'\" + escaped + \"'\"\n\n\ndef main(extracted_text: str)\
          \ -> dict:\n    text = extracted_text.strip()\n\n    # Accept an optional\
          \ Markdown code fence.\n    if text.startswith(\"```\"):\n        lines\
          \ = text.splitlines()\n        if lines[-1].strip() != \"```\":\n      \
          \      raise ValueError(\"Incomplete JSON code fence.\")\n        text =\
          \ \"\\n\".join(lines[1:-1])\n\n    data = json.loads(text)\n    class_name\
          \ = data.get(\"class\")\n    days = data.get(\"days\")\n    rows = data.get(\"\
          rows\")\n    uncertainties = data.get(\"uncertainties\", [])\n\n    if not\
          \ isinstance(class_name, str) or not class_name.strip():\n        raise\
          \ ValueError(\"Missing class identifier.\")\n\n    if (\n        not isinstance(days,\
          \ list)\n        or not days\n        or any(not isinstance(day, str) or\
          \ not day.strip() for day in days)\n        or len(set(days)) != len(days)\n\
          \    ):\n        raise ValueError(\"Invalid or duplicate day labels.\")\n\
          \n    if not isinstance(rows, list) or not rows:\n        raise ValueError(\"\
          No timetable rows found.\")\n\n    if not isinstance(uncertainties, list):\n\
          \        raise ValueError(\"uncertainties must be a list.\")\n\n    # Remove\
          \ a duplicated header only when it exactly matches days.\n    normalize\
          \ = lambda value: value.strip().casefold()\n\n    if (\n        rows\n \
          \       and isinstance(rows[0], list)\n        and all(isinstance(cell,\
          \ str) for cell in rows[0])\n        and [normalize(cell) for cell in rows[0]]\n\
          \        == [normalize(day) for day in days]\n    ):\n        rows = rows[1:]\n\
          \        uncertainties = uncertainties + [\n            \"A duplicated weekday\
          \ header was removed from rows.\"\n        ]\n\n    # Reject any remaining\
          \ weekday labels inside teaching cells.\n    day_labels = {normalize(day)\
          \ for day in days}\n    for row in rows:\n        if isinstance(row, list):\n\
          \            for cell in row:\n                if isinstance(cell, str)\
          \ and normalize(cell) in day_labels:\n                    raise ValueError(\n\
          \                        \"A weekday header appears inside the teaching\
          \ grid. \"\n                        \"Review the extraction.\"\n       \
          \             )        \n\n    counts = Counter()\n\n    for period, row\
          \ in enumerate(rows, start=1):\n        if not isinstance(row, list) or\
          \ len(row) != len(days):\n            raise ValueError(\n              \
          \  f\"Period {period}: expected {len(days)} cells.\"\n            )\n\n\
          \        for subject in row:\n            if subject is None:\n        \
          \        continue\n            if not isinstance(subject, str) or not subject.strip():\n\
          \                raise ValueError(f\"Invalid subject in period {period}.\"\
          )\n            if subject.strip().upper() == \"UNREADABLE\":\n         \
          \       raise ValueError(\n                    \"Unreadable cell: review\
          \ the extraction first.\"\n                )\n            counts[subject.strip()]\
          \ += 1\n\n    # Numbered identifiers avoid collisions between subject abbreviations.\n\
          \    class_id = re.sub(\n        r\"[^a-z0-9]+\", \"_\", class_name.lower()\n\
          \    ).strip(\"_\") or \"class\"\n\n    facts = [\n        \"% Teacher identifiers\
          \ are placeholders; replace before scheduling.\",\n        f\"slots_per_day({len(rows)}).\"\
          ,\n        f\"slots_per_week({len(rows) * len(days)}).\",\n        \"\"\n\
          \    ]\n\n    for index, subject in enumerate(sorted(counts), start=1):\n\
          \        teacher = f\"teacher_{class_id}_{index:02d}\"\n        facts.append(\n\
          \            \"class_subject_teacher_times(\"\n            f\"{prolog_atom(class_name)},\
          \ \"\n            f\"{prolog_atom(subject)}, \"\n            f\"{prolog_atom(teacher)},\
          \ \"\n            f\"{counts[subject]}).\"\n        )\n\n    return {\n\
          \        \"prolog_facts\": \"\\n\".join(facts),\n        \"subject_counts\"\
          : json.dumps(\n            dict(sorted(counts.items())), ensure_ascii=False\n\
          \        ),\n        \"total_lessons\": sum(counts.values()),\n        \"\
          review_notes\": json.dumps(\n            uncertainties, ensure_ascii=False\n\
          \        )\n    }"
        code_language: python3
